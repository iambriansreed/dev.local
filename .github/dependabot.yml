# The workflows pin every action to a commit SHA (a moved or hijacked tag can't change
# what runs in a job that can push to main), so updates come from here instead: a
# weekly PR that bumps the SHA and its "# vX.Y.Z" comment together. npm likewise, for
# the few devDependencies package-lock.json pins. The commit prefixes keep these PRs
# Conventional Commits that cut no release (see CLAUDE.md, "Release pipeline").
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: ci
      groups:
          actions:
              patterns: ['*']

    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build
      groups:
          npm:
              patterns: ['*']
